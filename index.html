<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ePDF</title>
<meta name="description" content="ePDF — editor PDF libre en el navegador: anotar, editar, formularios, firma digital, OCR.">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ePDF">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/pdfjs-layers.css">
<link rel="stylesheet" href="css/app.css">
<!-- ePDF · Copyright (C) 2026 José Antonio Manteiga Presedo · AGPL-3.0-or-later -->
</head>
<body class="nodoc">
  <header id="topbar">
    <div class="brand">e<b>PDF</b></div>
    <div id="doctabs" aria-label="Documentos abiertos"></div>
    <div id="topact"></div>
  </header>
  <div id="searchbar" role="search"></div>
  <div id="banner"></div>
  <main>
    <div id="viewers" class="tool-hand"></div>
    <div id="start"></div>
    <div id="modebar"><nav id="modes" aria-label="Modos"></nav><div id="ctxbar" aria-label="Herramientas"></div></div>
    <aside id="sidebar"><div class="rail"></div><div class="sbody"></div></aside>
    <div id="hint"></div>
    <footer id="statusbar" class="nodoc"></footer>
  </main>
  <div id="backstage"></div>
  <div id="modals"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
